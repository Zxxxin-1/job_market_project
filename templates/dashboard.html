<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人工智能与数据科学就业趋势看板</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            margin: 20px;
            background: #f7f9fc;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart {
            width: 100%;
            height: 420px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <h1>人工智能与数据科学就业趋势可视化看板</h1>

    <div class="grid">
        <div id="cityDist" class="chart"></div>
        <div id="salaryByCity" class="chart"></div>
        <div id="skillHot" class="chart"></div>
        <div id="salaryRange" class="chart"></div>
    </div>

    <script>
        const cityChart = echarts.init(document.getElementById('cityDist'));
        const salaryChart = echarts.init(document.getElementById('salaryByCity'));
        const skillChart = echarts.init(document.getElementById('skillHot'));
        const rangeChart = echarts.init(document.getElementById('salaryRange'));

        axios.get('/api/city_dist').then(res => {
            const data = res.data.data || [];
            cityChart.setOption({
                title: { text: '各城市岗位数量分布', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: data.map(x => x.city) },
                yAxis: { type: 'value' },
                series: [{
                    type: 'bar',
                    data: data.map(x => x.job_count),
                    itemStyle: { color: '#5470c6' }
                }]
            });
        });

        axios.get('/api/salary_by_city').then(res => {
            const data = res.data.data || [];
            salaryChart.setOption({
                title: { text: '各城市平均薪资水平', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: data.map(x => x.city) },
                yAxis: { type: 'value', name: '平均薪资（k）' },
                series: [{
                    type: 'bar',
                    data: data.map(x => x.avg_salary),
                    itemStyle: { color: '#91cc75' }
                }]
            });
        });

        axios.get('/api/skill_hot').then(res => {
            const data = (res.data.data || []).slice(0, 10).reverse();
            skillChart.setOption({
                title: { text: '岗位技能需求热度 Top10', left: 'center' },
                tooltip: { trigger: 'axis' },
                yAxis: { type: 'category', data: data.map(x => x.skill) },
                xAxis: { type: 'value' },
                series: [{
                    type: 'bar',
                    data: data.map(x => x.count),
                    itemStyle: { color: '#fac858' }
                }]
            });
        });

        axios.get('/api/salary_range').then(res => {
            const data = res.data.data || [];
            rangeChart.setOption({
                title: { text: '薪资区间分布统计', left: 'center' },
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: data.map(x => ({
                        name: x.salary_range,
                        value: x.count
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            });
        });

        window.addEventListener('resize', () => {
            cityChart.resize();
            salaryChart.resize();
            skillChart.resize();
            rangeChart.resize();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>人工智能与数据科学就业趋势看板</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f7f9fc;
            padding: 24px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
        }
        
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            padding: 20px;
            margin-bottom: 24px;
            transition: 0.3s;
        }
        .card:hover {
            box-shadow: 0 5px 18px rgba(0,0,0,0.11);
        }
        
        #kgChart {
            width: 100%;
            height: 500px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .chart {
            width: 100%;
            height: 420px;
        }
    </style>
</head>
<body>
    <h1>人工智能与数据科学就业趋势可视化看板</h1>
    <!-- 新增：知识图谱卡片（放在页面最上方） -->
    <div class="card">
        <div id="kgChart"></div>
    </div>
    
    <div class="grid">
        <div class="card">
            <div id="cityDist" class="chart"></div>
        </div>
        <div class="card">
            <div id="salaryByCity" class="chart"></div>
        </div>
        <div class="card">
            <div id="skillHot" class="chart"></div>
        </div>
        <div class="card">
            <div id="salaryRange" class="chart"></div>
        </div>
    </div>
    <script>
        
        const kgChart = echarts.init(document.getElementById('kgChart'));
        const cityChart = echarts.init(document.getElementById('cityDist'));
        const salaryChart = echarts.init(document.getElementById('salaryByCity'));
        const skillChart = echarts.init(document.getElementById('skillHot'));
        const rangeChart = echarts.init(document.getElementById('salaryRange'));
        
        axios.get('/api/kg_data').then(res => {
            const data = res.data;
            const kgOption = {
                tooltip: {},
                animationDurationUpdate: 600,
                animationEasingUpdate: 'quinticInOut',
                series: [
                    {
                        type: 'graph',
                        layout: 'force',
                        force: {
                            repulsion: 1100,
                            edgeLength: 130,
                            layoutAnimation: false, 
                        },
                        roam: true,
                        label: {
                            show: true,
                            fontSize: 11,
                            scale: true,        
                            minFontSize: 1,    
                            emphasis: {
                                fontSize: 14    
                            }
                        },
                        edgeSymbol: ['none', 'arrow'],
                        edgeSymbolSize: [0,6],
                        edgeLabel: {
                            show: false 
                        },
                        data: data.nodes.map(node=>{
                            
                            let color, size;
                            if(node.label === "Job") {color="#87CEEB"; size=24;}
                            else if(node.label === "Skill") {color="#90EE90"; size=16;}
                            else if(node.label === "Company") {color="#FFB6C1"; size=18;}
                            else if(node.label === "City") {color="#DDA0DD"; size=20;}
                            else {color="#999"; size=14;}
                            return {
                                name: node.name,
                                id: node.id,
                                symbolSize: size,
                                itemStyle:{color:color}
                            }
                        }),
                        links: data.links.map(link=>{
                            return {
                                source: link.source,
                                target: link.target,
                                label:{show:false} 
                            }
                        }),
                        lineStyle: {
                            opacity: 0.7,
                            width: 1,
                            curveness: 0.1
                        }
                    }
                ]
            }
            kgChart.setOption(kgOption);
        })
        
        axios.get('/api/city_dist').then(res => {
            const data = res.data.data || [];
            cityChart.setOption({
                title: { text: '各城市岗位数量分布', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: data.map(x => x.city) },
                yAxis: { type: 'value' },
                series: [{
                    type: 'bar',
                    data: data.map(x => x.job_count),
                    itemStyle: { color: '#5470c6' }
                }]
            });
        });
        axios.get('/api/salary_by_city').then(res => {
            const data = res.data.data || [];
            salaryChart.setOption({
                title: { text: '各城市平均薪资水平', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: data.map(x => x.city) },
                yAxis: { type: 'value', name: '平均薪资（k）' },
                series: [{
                    type: 'bar',
                    data: data.map(x => x.avg_salary),
                    itemStyle: { color: '#91cc75' }
                }]
            });
        });
        axios.get('/api/skill_hot').then(res => {
            const data = (res.data.data || []).slice(0, 10).reverse();
            skillChart.setOption({
                title: { text: '岗位技能需求热度 Top10', left: 'center' },
                tooltip: { trigger: 'axis' },
                yAxis: { type: 'category', data: data.map(x => x.skill) },
                xAxis: { type: 'value' },
                series: [{
                    type: 'bar',
                    data: data.map(x => x.count),
                    itemStyle: { color: '#fac858' }
                }]
            });
        });
        axios.get('/api/salary_range').then(res => {
            const data = res.data.data || [];
            rangeChart.setOption({
                title: { text: '薪资区间分布统计', left: 'center' },
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: data.map(x => ({
                        name: x.salary_range,
                        value: x.count
                    })),
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            });
        });
       
        window.addEventListener('resize', () => {
            kgChart.resize();
            cityChart.resize();
            salaryChart.resize();
            skillChart.resize();
            rangeChart.resize();
        });
    </script>
</body>
</html>
